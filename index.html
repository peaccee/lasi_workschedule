<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>班表 · 我的班表行事曆</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#f7f7f5;
  --ink-soft:#282f3d;
  --paper:#c8d9e8;
  --paper-dim:#f5f5f5;
  --dawn:#e0a96d;
  --dawn-dim:#3d3122;
  --dusk:#7a8eb8;
  --dusk-dim:#252d3d;
  --rest:#729b79;
  --rest-dim:#223326;
  --flag:#d06a68;
  --muted:#5c677d;
  --line:rgba(241,243,248,0.12);
  --radius:14px;
  font-size:16px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  background:var(--ink);
  color:var(--paper);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:64px;
}

.wrap{
  max-width:640px;
  margin:0 auto;
  padding:20px 16px 40px;
}

/* ---------- Header ---------- */

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.brand{
  display:flex;
  flex-direction:column;
}

.brand .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.18em;
  color:var(--muted);
  text-transform:uppercase;
}

.brand h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:26px;
  margin:2px 0 0;
  letter-spacing:-0.01em;
}

.sync-info{
  margin-top:5px;
  font-size:10px;
  color:var(--muted);
}

.btn{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:13.5px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--paper);
  padding:9px 14px;
  border-radius:999px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:background .15s ease,transform .1s ease;
}

.btn:hover{
  background:rgba(241,243,248,0.08);
}

.btn:active{
  transform:scale(0.97);
}

.btn-primary{
  background:var(--paper);
  color:var(--ink);
  border-color:var(--paper);
}

.btn-primary:hover{
  background:#fff;
}

.btn-ghost{
  border:none;
  color:var(--muted);
  padding:6px 8px;
}

.btn-danger{
  color:#e57373;
  border-color:rgba(229,115,115,0.4);
}

section{
  margin-bottom:30px;
}

.section-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  letter-spacing:.14em;
  color:var(--muted);
  text-transform:uppercase;
  margin:0 0 10px 2px;
}

/* ---------- Punch card ---------- */

.punch-card{
  position:relative;
  background:var(--paper);
  color:var(--ink);
  border-radius:var(--radius);
  padding:26px 22px 22px;
  display:flex;
  align-items:stretch;
  gap:18px;
  box-shadow:0 18px 40px -18px rgba(0,0,0,0.5);
}

.punch-card::before,
.punch-card::after{
  content:'';
  position:absolute;
  left:14px;
  right:14px;
  height:14px;
  background-image:radial-gradient(circle at 10px 7px,var(--ink) 4.5px,transparent 5.5px);
  background-size:22px 14px;
  background-repeat:repeat-x;
  background-position:4px 0;
}

.punch-card::before{
  top:-7px;
}

.punch-card::after{
  bottom:-7px;
  transform:rotate(180deg);
}

.punch-left{
  flex:1 1 auto;
  min-width:0;
}

.punch-left .weekday{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:.1em;
  color:var(--muted);
  text-transform:uppercase;
}

.punch-left .datenum{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:44px;
  line-height:1.05;
  margin:2px 0 10px;
}

.punch-tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  font-weight:600;
  padding:5px 10px;
  border-radius:999px;
  background:rgba(27,32,40,0.08);
}

.punch-divider{
  width:1px;
  border-left:2px dashed rgba(27,32,40,0.2);
}

.punch-right{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
}

.punch-right .code{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:15px;
  color:var(--muted);
}

.punch-right .time{
  font-family:'IBM Plex Mono',monospace;
  font-weight:600;
  font-size:22px;
  margin-top:4px;
  letter-spacing:-0.02em;
}

.punch-right .note{
  margin-top:8px;
  font-size:12.5px;
  color:var(--flag);
  font-weight:600;
}

.punch-right .empty{
  font-size:14px;
  color:var(--muted);
}

.type-early .punch-tag{
  background:rgba(224,169,109,0.2);
  color:#8d5718;
}

.type-late .punch-tag{
  background:rgba(122,142,184,0.22);
  color:#2f4673;
}

.type-leave .punch-tag{
  background:rgba(114,155,121,0.22);
  color:#284f2e;
}

/* ---------- 7-day strip ---------- */

.week-scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:2px 2px 6px;
  scrollbar-width:none;
}

.week-scroll::-webkit-scrollbar{
  display:none;
}

.day-chip{
  flex:0 0 auto;
  width:86px;
  background:var(--ink-soft);
  border-radius:12px;
  padding:12px 10px;
  border:1px solid var(--line);
}

.day-chip.today{
  border-color:var(--paper);
}

.day-chip .dc-weekday{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--muted);
  letter-spacing:.08em;
}

.day-chip .dc-date{
  font-family:'Fraunces',serif;
  font-size:20px;
  font-weight:600;
  margin:2px 0 8px;
}

.day-chip .dc-badge{
  display:inline-block;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  font-weight:600;
  padding:3px 7px;
  border-radius:6px;
  margin-bottom:5px;
}

.day-chip .dc-time{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--muted);
}

.day-chip .dc-empty{
  font-size:11.5px;
  color:var(--muted);
  padding-top:6px;
}

.badge-early{
  background:var(--dawn-dim);
  color:var(--dawn);
}

.badge-late{
  background:var(--dusk-dim);
  color:var(--dusk);
}

.badge-leave{
  background:var(--rest-dim);
  color:var(--rest);
}

/* ---------- Month calendar ---------- */

.month-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.month-head .mh-title{
  font-family:'Fraunces',serif;
  font-size:19px;
  font-weight:600;
}

.month-nav{
  display:flex;
  align-items:center;
  gap:4px;
}

.weekday-row{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-bottom:6px;
}

.weekday-row span{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
}

.month-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.day-cell{
  aspect-ratio:1 / 1.02;
  border-radius:10px;
  background:var(--ink-soft);
  border:1px solid var(--line);
  padding:6px 5px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:3px;
  position:relative;
  transition:background .12s ease,transform .08s ease;
}

.day-cell:hover{
  background:#343d4f;
}

.day-cell:active{
  transform:scale(0.96);
}

.day-cell.empty-cell{
  background:transparent;
  border-color:transparent;
  cursor:default;
}

.day-cell.is-today{
  box-shadow:inset 0 0 0 1.5px var(--paper);
}

.day-cell .num{
  font-family:'IBM Plex Mono',monospace;
  font-size:11.5px;
  color:var(--muted);
}

.day-cell.is-today .num{
  color:var(--paper);
  font-weight:700;
}

.day-cell .chip{
  font-size:12px;
  font-weight:700;
  font-family:'IBM Plex Mono',monospace;
  padding:2px 4px;
  border-radius:5px;
  align-self:flex-start;
  line-height:1.5;
}

.day-cell .mini-time{
  font-size:11px;
  color:var(--muted);
  font-family:'IBM Plex Mono',monospace;
}

.day-cell .flag-dot{
  position:absolute;
  top:6px;
  right:6px;
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--flag);
}

/* ---------- Stats ---------- */

.stats-card{
  background:var(--ink-soft);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
}

.stats-top{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:12px;
}

.stats-top .big{
  font-family:'Fraunces',serif;
  font-size:26px;
  font-weight:600;
}

.stats-top .big span{
  font-size:15px;
  color:var(--muted);
  font-weight:400;
  font-family:'Inter',sans-serif;
}

.quota-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.quota-pill{
  flex:1 1 auto;
  min-width:84px;
  background:var(--ink);
  border-radius:10px;
  padding:9px 10px;
  border:1px solid var(--line);
}

.quota-pill .ql-label{
  font-size:11px;
  color:var(--muted);
}

.quota-pill .ql-val{
  font-family:'IBM Plex Mono',monospace;
  font-size:16px;
  font-weight:600;
  margin-top:2px;
}

.quota-pill.over .ql-val{
  color:var(--flag);
}

.quota-pill.ok .ql-val{
  color:var(--rest);
}

.extra-row{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  font-size:12.5px;
  color:var(--muted);
  margin-top:4px;
}

.extra-row b{
  color:var(--paper);
}

.no-quota{
  font-size:13px;
  color:var(--muted);
}

/* ---------- Empty ---------- */

.empty-state{
  border:1px dashed var(--line);
  border-radius:var(--radius);
  padding:26px 18px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.empty-state .btn{
  margin-top:12px;
}

/* ---------- Modal ---------- */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(15,18,23,0.72);
  backdrop-filter:blur(3px);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}

.overlay.show{
  opacity:1;
  pointer-events:auto;
}

.modal{
  background:var(--ink-soft);
  width:100%;
  max-width:640px;
  border-radius:18px 18px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:86vh;
  overflow-y:auto;
  transform:translateY(16px);
  transition:transform .18s ease;
  border-top:1px solid var(--line);
}

.overlay.show .modal{
  transform:translateY(0);
}

.modal h2{
  font-family:'Fraunces',serif;
  font-size:20px;
  margin:0 0 4px;
}

.modal .sub{
  font-size:12.5px;
  color:var(--muted);
  margin-bottom:16px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:12.5px;
  color:var(--muted);
  margin-bottom:6px;
}

input[type=month],
select,
textarea{
  width:100%;
  background:var(--ink);
  border:1px solid var(--line);
  color:var(--paper);
  border-radius:10px;
  padding:10px 12px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13.5px;
}

textarea{
  min-height:150px;
  resize:vertical;
  line-height:1.6;
}

select{
  font-family:'Inter',sans-serif;
}

.hint-box{
  background:var(--ink);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  font-size:12px;
  color:var(--muted);
  line-height:1.7;
  margin-bottom:14px;
}

.hint-box code{
  color:var(--paper);
  background:rgba(241,243,248,0.08);
  padding:1px 5px;
  border-radius:4px;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:14px;
  font-size:13px;
  color:var(--paper);
}

.checkbox-row input{
  width:16px;
  height:16px;
}

.preview-box{
  background:var(--ink);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  max-height:140px;
  overflow-y:auto;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  margin-bottom:14px;
}

.preview-box .pv-line{
  padding:2px 0;
  color:var(--paper);
}

.preview-box .pv-err{
  color:var(--flag);
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:6px;
}

.modal-actions .btn{
  flex:1;
  justify-content:center;
}

.modal-close{
  position:absolute;
  top:14px;
  right:14px;
}

.modal-wrap{
  position:relative;
}

.toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:var(--paper);
  color:var(--ink);
  padding:10px 18px;
  border-radius:999px;
  font-size:13.5px;
  font-weight:600;
  box-shadow:0 10px 30px -10px rgba(0,0,0,0.5);
  z-index:80;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(-6px);
}

@media(max-width:380px){
  .punch-left .datenum{
    font-size:36px;
  }

  .punch-right .time{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="topbar">

    <div class="brand">
      <span class="eyebrow">Shift Punch Card</span>
      <h1>我的班表</h1>
      <div class="sync-info" id="syncInfo">同步資料中…</div>
    </div>

    <button class="btn btn-primary" id="openBatchBtn">
      ＋ 批次輸入
    </button>

  </div>

  <section>
    <div class="section-label">今日</div>
    <div id="todayCard"></div>
  </section>

  <section>
    <div class="section-label">近 7 日</div>
    <div class="week-scroll" id="weekStrip"></div>
  </section>

  <section>

    <div class="month-head">

      <div class="mh-title" id="monthTitle"></div>

      <div class="month-nav">
        <button class="btn btn-ghost" id="prevMonthBtn">‹</button>
        <button class="btn btn-ghost" id="todayMonthBtn" style="font-size:12px;">
          本月
        </button>
        <button class="btn btn-ghost" id="nextMonthBtn">›</button>
      </div>

    </div>

    <div class="weekday-row">
      <span>日</span>
      <span>一</span>
      <span>二</span>
      <span>三</span>
      <span>四</span>
      <span>五</span>
      <span>六</span>
    </div>

    <div class="month-grid" id="monthGrid"></div>

  </section>

  <section id="statsSection">

    <div class="section-label">本月休假統計</div>

    <div class="stats-card" id="statsCard"></div>

  </section>

</div>


<div class="toast" id="toast"></div>


<!-- Batch input modal -->

<div class="overlay" id="batchOverlay">

  <div class="modal">

    <div class="modal-wrap">

      <button class="btn btn-ghost modal-close" id="closeBatchBtn">
        ✕
      </button>

      <h2>批次輸入本月班表</h2>

      <div class="sub">
        選擇月份，貼上班表清單即可一次輸入
      </div>

      <div class="field">

        <label>選擇月份</label>

        <input type="month" id="batchMonth">

      </div>

      <div class="hint-box">

        每行一筆，<code>日期 代號</code>，以空白分隔。支援：

        <br>

        <code>1 Q002</code> 單日 ／
        <code>1-5 Q002</code> 連續區間 ／
        <code>2026-01-01 Q002</code> 完整日期

        <br>

        代號可參考：

        早班 Q002 Q003 Q004 Q005 Q006 Q007

        晚班 Q013 Q014 Q015 Q016 Q017 Q021

        休假 Z02 Z01 Z03 00001 00030 抵

      </div>

      <div class="field">

        <label>貼上班表</label>

        <textarea
          id="batchText"
          placeholder="1 Q002&#10;2 Q002&#10;3 Z01&#10;4-5 Q013&#10;6 00001"
        ></textarea>

      </div>

      <label class="checkbox-row">

        <input type="checkbox" id="clearMonthFirst">

        套用前先清空本月已輸入的班表

      </label>

      <div class="field" id="previewWrap" style="display:none;">

        <label>預覽</label>

        <div class="preview-box" id="previewBox"></div>

      </div>

      <div class="modal-actions">

        <button
          class="btn"
          id="previewBtn"
          style="flex:1;justify-content:center;"
        >
          預覽
        </button>

        <button
          class="btn btn-primary"
          id="applyBatchBtn"
          style="flex:1;"
        >
          套用並儲存
        </button>

      </div>

    </div>

  </div>

</div>


<!-- Single day edit modal -->

<div class="overlay" id="dayOverlay">

  <div class="modal">

    <div class="modal-wrap">

      <button class="btn btn-ghost modal-close" id="closeDayBtn">
        ✕
      </button>

      <h2 id="dayModalTitle">編輯班表</h2>

      <div class="sub">
        選擇代號後立即儲存
      </div>

      <div class="field">

        <label>班別代號</label>

        <select id="dayCodeSelect"></select>

      </div>

      <div class="modal-actions">

        <button
          class="btn btn-danger"
          id="clearDayBtn"
          style="flex:1;justify-content:center;"
        >
          清除此日
        </button>

        <button
          class="btn btn-primary"
          id="saveDayBtn"
          style="flex:1;"
        >
          儲存
        </button>

      </div>

    </div>

  </div>

</div>

/* =========================================================
   基本工具
   ========================================================= */

function pad(n){

  return String(n).padStart(2,'0');

}


function fmtDate(y,m,d){

  return `${y}-${pad(m)}-${pad(d)}`;

}


function addDays(dateStr,n){

  const [
    y,
    m,
    d
  ] = dateStr.split('-').map(Number);

  const dt = new Date(
    y,
    m-1,
    d
  );

  dt.setDate(
    dt.getDate()+n
  );

  return fmtDate(
    dt.getFullYear(),
    dt.getMonth()+1,
    dt.getDate()
  );

}


function weekdayOf(dateStr){

  const [
    y,
    m,
    d
  ] = dateStr.split('-').map(Number);

  return new Date(
    y,
    m-1,
    d
  ).getDay();

}


function daysInMonth(y,m){

  return new Date(
    y,
    m,
    0
  ).getDate();

}

/* =========================================================
   雲端讀取
   ========================================================= */

async function loadData(){

  updateSyncInfo(
    '正在讀取雲端資料…'
  );

  try{

    const res = await fetch(

      `https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}/latest`,

      {
        method:'GET',

        headers:{
          'X-Master-Key':
            CONFIG.API_KEY
        },

        cache:'no-store'

      }

    );


    if(!res.ok){

      const errorText =
        await res.text();

      throw new Error(
        `HTTP ${res.status} ${errorText}`
      );

    }


    const data =
      await res.json();


    shifts =
      data.record?.shifts || {};


    /*

      將成功取得的雲端資料
      同時存成本機快取。

      注意：
      這只是備援，不是跨裝置同步。

    */

    localStorage.setItem(

      'shift-data-cache',

      JSON.stringify(shifts)

    );


    const updatedAt =
      data.record?.updatedAt;


    if(updatedAt){

      const date =
        new Date(updatedAt);

      updateSyncInfo(
        '最後同步：' +
        date.toLocaleString(
          'zh-TW',
          {
            month:'numeric',
            day:'numeric',
            hour:'2-digit',
            minute:'2-digit'
          }
        )
      );

    }else{

      updateSyncInfo(
        '已從雲端同步'
      );

    }


    return true;


  }catch(e){

    console.error(
      'JSONBin 讀取失敗：',
      e
    );


    /*

      如果雲端失敗，
      嘗試使用這台裝置之前留下的快取。

    */

    const local =
      localStorage.getItem(
        'shift-data-cache'
      );


    if(local){

      try{

        shifts =
          JSON.parse(local);

        updateSyncInfo(
          '雲端讀取失敗 · 使用本機快取'
        );

        showToast(
          '雲端讀取失敗，使用本機快取'
        );

        return false;

      }catch(parseError){

        console.error(
          '本機資料解析失敗',
          parseError
        );

      }

    }


    shifts = {};

    updateSyncInfo(
      '無法取得雲端資料'
    );

    showToast(
      '無法讀取雲端班表'
    );

    return false;

  }

}


/* =========================================================
   雲端儲存
   ========================================================= */

async function saveData(){

  /*

    先保存本機快取。

    即使雲端暫時失敗，
    目前裝置仍然不會立即遺失資料。

  */

  localStorage.setItem(

    'shift-data-cache',

    JSON.stringify(shifts)

  );


  updateSyncInfo(
    '正在同步雲端…'
  );


  try{

    const res = await fetch(

      `https://api.jsonbin.io/v3/b/${CONFIG.BIN_ID}`,

      {

        method:'PUT',

        headers:{

          'Content-Type':
            'application/json',

          'X-Master-Key':
            CONFIG.API_KEY

        },

        body:JSON.stringify({

          shifts:shifts,

          updatedAt:
            new Date().toISOString()

        })

      }

    );


    const responseText =
      await res.text();


    if(!res.ok){

      throw new Error(
        `HTTP ${res.status}: ${responseText}`
      );

    }


    console.log(
      'JSONBin 同步成功',
      responseText
    );


    updateSyncInfo(
      '剛剛已同步'
    );


    return true;


  }catch(e){

    console.error(
      'JSONBin 同步失敗：',
      e
    );


    updateSyncInfo(
      '雲端同步失敗'
    );


    return false;

  }

}

/* =========================================================
   批次資料解析
   ========================================================= */

function parseBatchInput(
  text,
  year,
  month
){

  const lines =
    text.split('\n');


  const result = {};

  const errors = [];


  for(const raw of lines){

    let line =
      raw.trim();


    if(
      !line ||
      line.startsWith('#')
    ){

      continue;

    }


    line =
      line
        .replace(
          /[,\t、]+/g,
          ' '
        )
        .replace(
          /\s+/g,
          ' '
        );


    const parts =
      line.split(' ');


    if(parts.length < 2){

      errors.push(
        `無法解析：「${raw}」`
      );

      continue;

    }


    const dayPart =
      parts[0];


    const rawCode =
      parts
        .slice(1)
        .join(' ')
        .trim();


    const code =
      CODES[rawCode]
        ? rawCode
        : rawCode.toUpperCase();


    if(!CODES[code]){

      errors.push(
        `未知代號「${rawCode}」：「${raw}」`
      );

      continue;

    }


    let dates = [];


    if(
      /^\d{4}-\d{1,2}-\d{1,2}$/
        .test(dayPart)
    ){

      const [
        yy,
        mm,
        dd
      ] =
        dayPart
          .split('-')
          .map(Number);


      dates = [
        fmtDate(
          yy,
          mm,
          dd
        )
      ];

    }


    else if(
      /^\d{1,2}-\d{1,2}$/
        .test(dayPart)
    ){

      const [
        s,
        e
      ] =
        dayPart
          .split('-')
          .map(Number);


      if(
        s > e ||
        s < 1 ||
        e > 31
      ){

        errors.push(
          `日期區間錯誤：「${raw}」`
        );

        continue;

      }


      for(
        let d=s;
        d<=e;
        d++
      ){

        if(
          d <= daysInMonth(
            year,
            month
          )
        ){

          dates.push(
            fmtDate(
              year,
              month,
              d
            )
          );

        }

      }

    }


    else if(
      /^\d{1,2}$/
        .test(dayPart)
    ){

      const day =
        Number(dayPart);


      if(
        day < 1 ||
        day > daysInMonth(
          year,
          month
        )
      ){

        errors.push(
          `日期超出當月範圍：「${raw}」`
        );

        continue;

      }


      dates = [

        fmtDate(
          year,
          month,
          day
        )

      ];

    }


    else{

      errors.push(
        `無法解析日期：「${raw}」`
      );

      continue;

    }


    for(const d of dates){

      result[d] =
        code;

    }

  }


  return {
    result,
    errors
  };

}

              ${date}
              ${code}
              ${desc}

            </div>

          `;

        }
      );


      errors.forEach(
        err => {

          html += `

            <div class="pv-line pv-err">

              ⚠ ${err}

            </div>

          `;

        }
      );


      html += `

        <div
          class="pv-line"
          style="
            color:var(--muted);
            margin-top:6px;
          "
        >
          共 ${entries.length} 筆，
          ${errors.length} 筆錯誤
        </div>

      `;


      box.innerHTML =
        html;

    }
  );


/* =========================================================
   批次套用並同步
   ========================================================= */

document
  .getElementById('applyBatchBtn')
  .addEventListener(
    'click',
    async ()=>{

      const ym =
        currentBatchYM();


      if(!ym){

        showToast(
          '請先選擇月份'
        );

        return;

      }


      const text =
        document.getElementById(
          'batchText'
        ).value;


      const {
        result,
        errors
      } =
        parseBatchInput(
          text,
          ym.y,
          ym.m
        );


      if(
        Object.keys(result).length === 0
      ){

        showToast(
          errors.length
            ? '輸入內容有錯誤'
            : '沒有可套用的資料'
        );

        return;

      }


      if(
        document.getElementById(
          'clearMonthFirst'
        ).checked
      ){

        const total =
          daysInMonth(
            ym.y,
            ym.m
          );


        for(
          let d=1;
          d<=total;
          d++
        ){

          delete shifts[
            fmtDate(
              ym.y,
              ym.m,
              d
            )
          ];

        }

      }


      Object.assign(
        shifts,
        result
      );


      viewYear =
        ym.y;

      viewMonth =
        ym.m;


      renderAll();


      batchOverlay
        .classList
        .remove('show');


      showToast(
        '正在同步雲端…'
      );


      const success =
        await saveData();


      if(success){

        showToast(
          `已成功同步 ${
            Object.keys(result).length
          } 筆班表`
        );

      }else{

        showToast(
          '雲端同步失敗，資料目前只保存在此裝置'
        );

      }

    }
  );


/* =========================================================
   單日編輯
   ========================================================= */

const dayOverlay =
  document.getElementById(
    'dayOverlay'
  );


let editingDate = null;


/* 建立班別選單 */

function buildDaySelect(){

  const sel =
    document.getElementById(
      'dayCodeSelect'
    );


  const groups = {

    '早班':[],
    '晚班':[],
    '休假':[]

  };


  Object.entries(
    CODES
  ).forEach(
    ([code,info])=>{

      if(
        info.type === 'early'
      ){

        groups['早班'].push(
          [
            code,
            `${code} ${info.time}${
              info.note
                ? '（'+info.note+'）'
                : ''
            }`
          ]
        );

      }

      else if(
        info.type === 'late'
      ){

        groups['晚班'].push(
          [
            code,
            `${code} ${info.time}${
              info.note
                ? '（'+info.note+'）'
                : ''
            }`
          ]
        );

      }

      else{

        groups['休假'].push(
          [
            code,
            `${code} ${info.label}`
          ]
        );

      }

    }
  );


  let html =
    `<option value="">
      （未排班）
    </option>`;


  Object.entries(
    groups
  ).forEach(
    ([group,items])=>{

      html +=
        `<optgroup label="${group}">`;


      items.forEach(
        ([code,label])=>{

          html +=
            `<option value="${code}">
              ${label}
            </option>`;

        }
      );


      html +=
        `</optgroup>`;

    }
  );


  sel.innerHTML =
    html;

}


buildDaySelect();


/* 開啟單日 */

function openDayModal(
  dateStr
){

  editingDate =
    dateStr;


  const [
    y,
    m,
    d
  ] =
    dateStr
      .split('-')
      .map(Number);


  document.getElementById(
    'dayModalTitle'
  ).textContent =

    `編輯 ${y}/${m}/${d}（${
      WEEKDAYS_ZH[
        weekdayOf(dateStr)
      ]
    }）`;


  document.getElementById(
    'dayCodeSelect'
  ).value =
    shifts[dateStr] || '';


  dayOverlay
    .classList
    .add('show');

}


/* 關閉 */

document
  .getElementById('closeDayBtn')
  .addEventListener(
    'click',
    ()=>{
      dayOverlay
        .classList
        .remove('show');
    }
  );


dayOverlay
  .addEventListener(
    'click',
    e => {

      if(
        e.target === dayOverlay
      ){

        dayOverlay
          .classList
          .remove('show');

      }

    }
  );


/* =========================================================
   單日儲存
   ========================================================= */

document
  .getElementById('saveDayBtn')
  .addEventListener(
    'click',
    async ()=>{

      if(!editingDate){

        return;

      }


      const val =
        document.getElementById(
          'dayCodeSelect'
        ).value;


      if(val){

        shifts[
          editingDate
        ] =
          val;

      }else{

        delete shifts[
          editingDate
        ];

      }


      renderAll();


      dayOverlay
        .classList
        .remove('show');


      showToast(
        '正在同步雲端…'
      );


      const success =
        await saveData();


      showToast(

        success
          ? '已更新並完成同步'
          : '更新完成，但雲端同步失敗'

      );

    }
  );


/* =========================================================
   單日清除
   ========================================================= */

document
  .getElementById('clearDayBtn')
  .addEventListener(
    'click',
    async ()=>{

      if(!editingDate){

        return;

      }


      delete shifts[
        editingDate
      ];


      renderAll();


      dayOverlay
        .classList
        .remove('show');


      showToast(
        '正在同步雲端…'
      );


      const success =
        await saveData();


      showToast(

        success
          ? '已清除並完成同步'
          : '已清除，但雲端同步失敗'

      );

    }
  );


/* =========================================================
   初始化
   ========================================================= */

(async function init(){

  viewYear =
    todayObj.getFullYear();


  viewMonth =

  document.getElementById(

  ).innerHTML = `

    <div class="punch-card">

      <div class="punch-left">

        <div class="weekday">
          同步資料中…
        </div>

      </div>

    </div>

  `;


  await loadData();


  renderAll();

})();

</script>
